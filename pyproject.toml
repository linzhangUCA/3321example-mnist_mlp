[project]
name = "mnist"
version = "0.1.0"
description = "Classify hand-written digits using MNIST dataset and MLP model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "ipykernel>=7.4.0",
  "matplotlib>=3.11.0",
  "numpy>=2.4.6",
  "pandas>=3.1.0",
  "scikit-learn>=1.9.1",
  "torch>=2.14.1",
  "torchvision>=0.29.1",
]
